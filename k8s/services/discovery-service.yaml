apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: codepilot-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: codepilot-discovery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: codepilot-apps
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
