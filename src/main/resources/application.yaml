server:
  port: 8080

spring:
  application:
    name: codepilot-ai
  ai:
    openai:
      api-key: ${OPENAPI_KEY}
      base-url: https://openrouter.ai/api/v1

      chat:
        options:
          model: openai/gpt-oss-120b:free
          temperature: 0.0


  datasource:
    url: jdbc:postgresql://localhost:9000/testDB?options=-c TimeZone=Asia/Kolkata
    username: testUser
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
        jdbc:
          time_zone: Asia/Kolkata

jwt:
  secret-key: ${JWT_SECRET_KEY}

stripe:
  api:
    secret: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET_KEY}

client.url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

minio:
  url: ${MINIO_URL:http://localhost:9001}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  project-bucket: ${MINIO_PROJECT_BUCKET:projects}
