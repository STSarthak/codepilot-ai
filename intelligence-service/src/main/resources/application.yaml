server:
  port: 9030

spring:
  application:
    name: intelligence-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  ai:
    openai:
      api-key: ${OPENAPI_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openai/gpt-oss-120b:free
          temperature: 0.0
  datasource:
    url: ${INTELLIGENCE_DB_URL:jdbc:postgresql://localhost:9000/intelligence_db?options=-c TimeZone=Asia/Kolkata}
    username: ${INTELLIGENCE_DB_USERNAME:testUser}
    password: ${INTELLIGENCE_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true
        jdbc:
          time_zone: Asia/Kolkata
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sarthak.projects.codepilot_ai.event
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG
